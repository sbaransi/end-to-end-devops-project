# CI pipeline with GitHub Actions (replaces the Jenkinsfile).
# Runs on GitHub's servers on every push to the dev branch, or by hand from the Actions tab.
# Same steps as Jenkins: lint + security scan in parallel, tests, Docker build,
# push to Docker Hub, then update the dev image tag in the GitOps repository.
# Argo CD then deploys the new image (CD stays the same).

name: CI

on:
  push:
    branches: [dev]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

env:
  IMAGE_NAME: end-to-end-devops-project
  # "gha-<run number>", so tags never clash with the old Jenkins tags (1, 2, 3 ...)
  IMAGE_TAG: gha-${{ github.run_number }}

jobs:
  # ---- These two jobs run at the same time (in parallel) ----
  lint:
    name: Linting (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flake8
      - run: flake8 app.py tests

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r app.py

  # ---- Runs only after both checks passed ----
  test:
    name: Unit Tests (Pytest)
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v

  build-push:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  update-gitops:
    name: Update GitOps repository
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitOps repository
        uses: actions/checkout@v4
        with:
          repository: sbaransi/end-to-end-devops-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Set the new dev image tag
        run: |
          sed -i "s/^tag: .*/tag: '${IMAGE_TAG}'/" end-to-end-devops-project/dev/values.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add end-to-end-devops-project/dev/values.yaml
          if git diff --cached --quiet; then
            echo "dev already uses ${IMAGE_TAG} - nothing to update"
            exit 0
          fi
          git commit -m "Update dev image tag to ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin main
